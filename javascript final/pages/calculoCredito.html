<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Cuota de Crédito</title>
    <link rel="stylesheet" href="../css/style.css">  
</head>
<body>

    <div class="form-container" id="bloq1">
        <h2>Datos para Credito Banco de la Nacion</h2>
        <form id="datosGeneralesForm">
            <label for="nombre">Nombres:</label>
            <input type="text" id="nombres" required>

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" required>

            <label for="celular">Celular:</label>
            <input type="tel" id="celular" required>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" required>

            <label for="identificacion">Identificación:</label>
            <input type="number" id="identificacion" required>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" required>

            <input type="submit" value="Guardar">
            
        </form>
    </div>
 




    <div class="container" style="display: none;"  id="bloq2">
    <div class="result" >
        <h2>Credito Banco de la Nacion</h2>
        <h2>Cliente</h2>
        <p id="nombreReporte"></p>
        <p id="identificacionReporte"></p>
        <p id="celularReporte"></p>
        <p id="direccionReporte"></p>
        <p id="correoReporte"></p>
    </div>
      


        <form id="simulatorForm">
            <div class="form-group">
                <label for="monto">Monto del Crédito (en $):</label>
                <input type="number" id="monto" name="monto" required>
            </div>
            <div class="form-group">
                <label for="tasa">Tasa de Interés Anual (%):</label>
                <input type="number" id="tasa" name="tasa" required>
            </div>
            <div class="form-group">
                <label for="meses">Plazo (en Meses):</label>
                <input type="number" id="meses" name="meses" required>
            </div>

            <div class="form-group">
            <input type="checkbox" id="intereses" value="si" />
            <label for="valordeintereses">Imprimir plan de pagos</label>
        </div>

            <input type="submit" value="Calcular">

       
        </form>

    <div class="container">

        <div class="result" id="result" style="display: none;">
            <h2>Resultado</h2>
            <p id="resultText"></p>
            <p id="valorintereses"></p>

           
        </div>

        <div  id="cardAsesor"  class="card" style="display: none;">
            <h2>Asesor Asignado </h2>
    
            <img src="https://via.placeholder.com/110" alt="Foto de perfil" id="imagenAsesor">
            <h2 id="nombreAsesor"></h2>
            <p class="position">Asesor Bancario</p>
            <p>Banco de la Nacion</p>
            <a id="correoAsesor" href="">Contactar</a>
        </div>

       
    </div>
      
    



    <table id="tablaplandepagos" style="display: none;">
        <thead>
            <tr>
                <th>Número de Cuota</th>
                <th>Capital ($)</th>
                <th>Intereses ($)</th>
                <th>Valor de la cuota ($)</th>
            </tr>
        </thead>
        <tbody id="tablaplandepagosbody"></tbody>
    </table>

    

    
    <script src="../js/main.js"></script>




</body>
</html>
